<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Compare — AI Capitalist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<style>
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
@media(max-width:700px) { .compare-grid { grid-template-columns: 1fr; } }

.compare-col { display: flex; flex-direction: column; gap: 14px; }
.compare-col-header {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.compare-col-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-3); margin-bottom: 6px;
}
.compare-input-row { display: flex; gap: 8px; }
.compare-input-row input {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 14px; color: var(--text-1);
  font-size: 14px; outline: none; font-family: var(--font-body);
}
.compare-input-row input:focus { border-color: rgba(108,78,200,0.5); }
.compare-input-row input::placeholder { color: var(--text-3); }

.cmp-card {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.cmp-card-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text-3);
}
.cmp-card-body { padding: 14px 16px; font-size: 13px; color: var(--text-1); line-height: 1.7; }

.verdict-bar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.v-sb { background: rgba(5,150,105,0.15); color: #05a875; border: 1px solid rgba(5,150,105,0.3); }
.v-b  { background: rgba(5,150,105,0.08); color: #059669; border: 1px solid rgba(5,150,105,0.2); }
.v-w  { background: rgba(194,124,14,0.08); color: #c27c0e; border: 1px solid rgba(194,124,14,0.25); }
.v-p  { background: rgba(220,38,38,0.08); color: #dc2626; border: 1px solid rgba(220,38,38,0.2); }
.v-sp { background: rgba(220,38,38,0.15); color: #ef4444; border: 1px solid rgba(220,38,38,0.3); }
.verdict-badge { padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 12px; font-family: var(--font-mono); letter-spacing: 1px; }
.score-num { font-size: 22px; font-weight: 800; font-family: var(--font-mono); }

.cmp-section-label {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-3); margin-bottom: 5px;
}
.cmp-pill {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 10px; font-family: var(--font-mono); margin: 2px;
}

.winner-badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 9px; font-family: var(--font-mono); letter-spacing: 1px;
  background: rgba(108,78,200,0.12); color: var(--accent); border: 1px solid rgba(108,78,200,0.25);
  text-transform: uppercase;
}

.cmp-divider {
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3); font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 1px; margin: 4px 0;
}
.vs-badge {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 50%; width: 36px; height: 36px; display: flex;
  align-items: center; justify-content: center; font-weight: 800;
  font-size: 11px; color: var(--text-2); font-family: var(--font-mono);
  flex-shrink: 0; align-self: center; margin-top: 18px;
}

/* Comparison summary table */
.cmp-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
.cmp-table th { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-3); padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
.cmp-table td { padding: 10px 12px; font-size: 12px; color: var(--text-1); border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: top; }
.cmp-table tr:last-child td { border-bottom: none; }
.cmp-table .row-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
.cmp-table td.highlight { background: rgba(108,78,200,0.06); }

.progress-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-3); font-family: var(--font-mono); padding: 8px 0; }
.progress-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; flex-shrink: 0; }
@keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

.thinking-dot { display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--text-3); margin:0 2px; animation:chatDotBounce 1.2s ease-in-out infinite; }
.thinking-dot:nth-child(2){animation-delay:0.2s}
.thinking-dot:nth-child(3){animation-delay:0.4s}
@keyframes chatDotBounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-5px);opacity:1} }
</style>
</head>

  <div class="nav-links">

<main class="main-wrap" style="max-width:1100px">
  <div style="margin-bottom:20px;">
    <h2 style="font-size:22px;font-weight:800;color:var(--text-1);margin-bottom:6px;">Compare</h2>
    <p style="font-size:13px;color:var(--text-3);">Run side-by-side analysis of two companies with the full Investment Committee.</p>
  </div>

  <!-- Mode + Language selectors -->
  <div style="margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:11px;font-family:var(--font-mono);color:var(--text-3);letter-spacing:1px;text-transform:uppercase;">Mode</span>
      <div id="modeSelector" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:11px;font-family:var(--font-mono);color:var(--text-3);letter-spacing:1px;text-transform:uppercase;">Language</span>
      <div style="display:flex;gap:4px;">
        <button id="langBtn_en" class="btn btn-ghost btn-sm" onclick="setLang('en')" style="font-size:11px;padding:3px 10px;">EN</button>
        <button id="langBtn_ja" class="btn btn-ghost btn-sm" onclick="setLang('ja')" style="font-size:11px;padding:3px 10px;">日本語</button>
      </div>
    </div>
  </div>

  <!-- Inputs -->
  <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;">
    <div>
      <div class="compare-col-label">Company A</div>
      <div class="compare-input-row">
        <input id="inputA" type="text" placeholder="e.g. OpenAI, NVDA, Stripe..." autocomplete="off"
          onkeydown="if(event.key==='Enter'&&!event.isComposing)startCompare()">
      </div>
    </div>
    <div class="vs-badge">VS</div>
    <div>
      <div class="compare-col-label">Company B</div>
      <div class="compare-input-row">
        <input id="inputB" type="text" placeholder="e.g. Anthropic, AMD, Adyen..." autocomplete="off"
          onkeydown="if(event.key==='Enter'&&!event.isComposing)startCompare()">
      </div>
    </div>
  </div>
  <div style="margin-top:12px;display:flex;gap:8px;align-items:center;">
    <button class="btn btn-primary" id="btnCompare" onclick="startCompare()">Compare →</button>
    <span id="cmpStatus" style="font-size:12px;font-family:var(--font-mono);color:var(--text-3);display:flex;align-items:center;gap:6px;"></span>
  </div>

  <!-- Error -->
  <div id="cmpError" class="error-box hidden" style="margin-top:12px;"></div>

  <!-- Results -->
  <div id="cmpResults" class="hidden" style="margin-top:28px;">

    <!-- Summary table -->
    <div id="summaryTable" style="margin-bottom:28px;"></div>

    <!-- Side-by-side columns -->
    <div class="compare-grid" id="compareColumns">
      <!-- Col A -->
      <div class="compare-col" id="colA"></div>
      <!-- Col B -->
      <div class="compare-col" id="colB"></div>
    </div>

  </div>
</main>

<script src="shared/config.js"></script>
<script src="shared/agents.js"></script>
<script src="shared/modes.js"></script>
<script>
'use strict';

const { loadConfig, callClaude, loadHistory, saveAnalysis } = window.ConfigModule;
const { getActiveAgents, buildAgentSystemPrompt } = window.AgentsModule;
const { loadModes } = window.ModesModule;

let selectedMode = null;
let isRunning = false;
let currentLang = 'en';  // 'en' | 'ja'

// ── Init ──────────────────────────────────────────────
async function init() {
  const cfg = loadConfig();
  // Default language from global setting
  currentLang = cfg.language === 'ja' ? 'ja' : 'en';

  const modes = loadModes();
  selectedMode = modes[0];
  const sel = document.getElementById('modeSelector');
  sel.innerHTML = modes.map(m => `
    <button class="btn btn-ghost btn-sm mode-btn" data-id="${m.id}" onclick="selectMode('${m.id}')" style="gap:6px;">
      ${m.icon} ${m.label.en}
    </button>`).join('');
  updateModeButtons();
  updateLangButtons();

  // Check for ?id= param (load from History)
  const params = new URLSearchParams(location.search);
  const historyId = params.get('id');
  if (historyId) {
    history.replaceState({}, '', location.pathname);
    await loadFromHistory(historyId);
  }
}

function selectMode(id) {
  const modes = loadModes();
  selectedMode = modes.find(m => m.id === id) || modes[0];
  updateModeButtons();
}
function updateModeButtons() {
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === selectedMode.id);
    b.style.borderColor = b.dataset.id === selectedMode.id ? 'rgba(108,78,200,0.5)' : '';
  });
}

function setLang(lang) {
  currentLang = lang;
  updateLangButtons();
}
function updateLangButtons() {
  ['en','ja'].forEach(l => {
    const btn = document.getElementById('langBtn_' + l);
    if (!btn) return;
    const active = l === currentLang;
    btn.style.borderColor = active ? 'rgba(108,78,200,0.5)' : '';
    btn.style.color = active ? 'var(--accent)' : '';
    btn.style.background = active ? 'var(--accent-dim)' : '';
  });
}

// ── Load from History ─────────────────────────────────
async function loadFromHistory(id) {
  setStatus('Loading from history...');
  try {
    const hist = await loadHistory();
    const item = hist.find(h => h.id === id);
    if (!item?.compareData) { setStatus(''); return; }
    const { nameA, nameB, resA, resB, debA, debB, synA, synB, agents, modeId } = item.compareData;
    document.getElementById('inputA').value = nameA || '';
    document.getElementById('inputB').value = nameB || '';
    // Restore mode
    const modes = loadModes();
    selectedMode = modes.find(m => m.id === modeId) || modes[0];
    updateModeButtons();
    setStatus('');
    renderComparison(nameA, nameB, resA, resB, debA, debB, synA, synB, agents);
  } catch(e) {
    setStatus('');
    showCmpError('Failed to load history: ' + e.message);
  }
}

// ── Run comparison ─────────────────────────────────────
async function startCompare() {
  const nameA = document.getElementById('inputA').value.trim();
  const nameB = document.getElementById('inputB').value.trim();
  if (!nameA || !nameB) { showCmpError('Please enter both company names.'); return; }
  if (nameA.toLowerCase() === nameB.toLowerCase()) { showCmpError('Please enter two different companies.'); return; }

  const cfg = loadConfig();
  if (!cfg.apiKey) { showCmpError('API key not set. Go to Settings first.'); return; }

  isRunning = true;
  document.getElementById('btnCompare').disabled = true;
  document.getElementById('cmpError').classList.add('hidden');
  document.getElementById('cmpResults').classList.add('hidden');
  setStatus('Starting comparison...');

  try {
    const agents = getActiveAgents();
    if (!agents.length) throw new Error('No agents enabled. Check Settings > Agents.');

    // Run both analyses in parallel (research in parallel, then debate sequentially per company)
    setStatus(`Researching ${nameA} & ${nameB} in parallel...`);
    const [resA, resB] = await Promise.all([
      runResearch(nameA, selectedMode, cfg),
      runResearch(nameB, selectedMode, cfg)
    ]);

    setStatus(`Running agent debate for ${nameA}...`);
    const debA = await runDebate(nameA, selectedMode, agents, resA, cfg);

    setStatus(`Running agent debate for ${nameB}...`);
    const debB = await runDebate(nameB, selectedMode, agents, resB, cfg);

    setStatus('Synthesizing each company...');
    const [synA, synB] = await Promise.all([
      runSynthesis(nameA, selectedMode, agents, debA),
      runSynthesis(nameB, selectedMode, agents, debB)
    ]);

    setStatus('');
    renderComparison(nameA, nameB, resA, resB, debA, debB, synA, synB, agents);

    // Save to History
    try {
      const higherScore = synA.score >= synB.score ? synA : synB;
      const entry = {
        id: 'cmp_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        name: `${nameA} vs ${nameB}`,
        mode: selectedMode.id,
        verdict: higherScore.verdict || 'WATCH',
        score: higherScore.score || 5,
        savedAt: new Date().toISOString(),
        synthesis: higherScore,
        compareData: { nameA, nameB, resA, resB, debA, debB, synA, synB, agents, modeId: selectedMode.id }
      };
      saveAnalysis(entry);
    } catch(e) { console.warn('Compare: saveAnalysis failed', e); }

  } catch(err) {
    showCmpError(err.message || 'Unknown error');
  } finally {
    isRunning = false;
    document.getElementById('btnCompare').disabled = false;
  }
}

// ── Research ─────────────────────────────────────────
async function runResearch(target, mode, cfg) {
  const sections = mode.researchSections.filter(s => s.enabled);
  const sourceGuide = {
    private: 'Priority sources: Crunchbase, LinkedIn, TechCrunch, PitchBook, company blog.',
    public:  'Priority sources: SEC EDGAR 10-K/10-Q, Bloomberg, Reuters, company IR page.',
    sme:     'Priority sources: company website, Google Maps reviews, LinkedIn, Glassdoor.'
  }[mode.id] || '';

  const lang = currentLang;
  const langInline = lang === 'ja' ? ' (日本語で記述)' : '';
  const prompt = `Research "${target}" for investment analysis.
${mode.researchPromptExtra}
SEARCH STRATEGY: ${sourceGuide}
CRITICAL: Populate every field. Mark estimates "(est.)". Plain text only, no nested JSON.
Monetary values: $10bn, $2.5m, ¥500bn. Write all values in ${lang === 'ja' ? 'Japanese' : 'English'}.
Return ONLY this JSON. Start with { on line 1. No preamble.
{
  "companyName": "official name${langInline}",
  "description": "2-sentence overview${langInline}",
  "sector": "sector${langInline}",
  ${sections.map(s => `"${s.key}": "findings for ${s.label.en} (2-3 sentences)${langInline}"`).join(',\n  ')}
}`;

  const raw = await callClaude({
    prompt,
    system: 'You are a JSON API. Output ONLY valid JSON. Start with { end with }. No markdown.',
    useSearch: cfg.webSearch,
    maxTokens: 3500
  });
  return parseResearch(raw, target, sections);
}

function parseResearch(raw, target, sections) {
  const stripped = raw.replace(/^```(?:json)?\s*/im,'').replace(/\s*```\s*$/im,'').trim();
  const braceIdx = stripped.indexOf('{');
  if (braceIdx >= 0) {
    const cand = stripped.slice(braceIdx);
    try { return JSON.parse(cand); } catch(e) {}
    const last = cand.lastIndexOf('}');
    if (last >= 0) { try { return JSON.parse(cand.slice(0, last+1)); } catch(e) {} }
    // per-field regex
    const result = { companyName: target, description: '', sector: 'Unknown' };
    const allKeys = ['companyName','description','sector',...sections.map(s=>s.key)];
    allKeys.forEach(k => {
      const m = cand.match(new RegExp('"'+k+'"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"'));
      if (m) result[k] = m[1].replace(/\\n/g,'\n').replace(/\\"/g,'"');
    });
    return result;
  }
  return { companyName: target, description: stripped.slice(0,300), sector: 'Unknown' };
}

// ── Debate ────────────────────────────────────────────
async function runDebate(target, mode, agents, research, cfg) {
  const resSummary = buildResSummary(research);
  const lang = currentLang;
  const langNote = lang === 'ja' ? '\n\nRespond entirely in Japanese (日本語で回答すること)。絵文字は使用しないこと。' : '\n\nRespond in English. No emoji.';
  const results = {};

  for (const agent of agents) {
    const system = buildAgentSystemPrompt(agent, mode);
    const prompt = `Company: "${target}" (${mode.label.en})
Research:
${resSummary}
As ${agent.name.en} (${agent.role.en}), provide your investment opinion.
1. Key Thesis (2-3 sentences)
2. Top 3 supporting points
3. Top 2 concerns
4. Score: X/10
5. Return: ${mode.returnMetric} — Bull/Base/Bear
Be direct. 200-300 words.${langNote}`;
    try {
      const text = await callClaude({ prompt, system, maxTokens: 900 });
      results[agent.id] = { agent, text };
    } catch(e) {
      results[agent.id] = { agent, text: `[Error: ${e.message}]` };
    }
  }
  return results;
}

// ── Synthesis ─────────────────────────────────────────
async function runSynthesis(target, mode, agents, debate) {
  const lang = currentLang;
  const langInline = lang === 'ja' ? ' (日本語)' : '';
  const debSummary = agents.map(a => {
    const r = debate[a.id]; return r ? `=== ${a.name.en} ===\n${r.text}` : '';
  }).filter(Boolean).join('\n\n').slice(0, 3500);

  const prompt = `You are CIO. Company: "${target}" (${mode.label.en})
Agent debate:
${debSummary}
Return ONLY JSON. Start with {.
{
  "verdict":"STRONG_BUY|BUY|WATCH|PASS|STRONG_PASS",
  "score":7.2,
  "headline":"one-sentence thesis${langInline}",
  "votes_buy":2,"votes_watch":2,"votes_pass":2,
  "bull_case":"2-3 sentences${langInline}",
  "bear_case":"2-3 sentences${langInline}",
  "key_risks":["risk1${langInline}","risk2${langInline}","risk3${langInline}"],
  "key_questions":["q1${langInline}","q2${langInline}"],
  "recommendation":"3-4 sentences${langInline}",
  "conviction":"HIGH|MEDIUM|LOW"
}`;
  const raw = await callClaude({
    prompt,
    system: 'You are a JSON API. Output ONLY valid JSON. Start { end }. No markdown.',
    maxTokens: 1200
  });
  const stripped = raw.replace(/^```(?:json)?\s*/im,'').replace(/\s*```\s*$/im,'').trim();
  const braceIdx = stripped.indexOf('{');
  if (braceIdx >= 0) {
    try { return JSON.parse(stripped.slice(braceIdx)); } catch(e) {}
    const last = stripped.lastIndexOf('}');
    if (last >= 0) try { return JSON.parse(stripped.slice(braceIdx, last+1)); } catch(e) {}
  }
  return { verdict:'WATCH', score:5, headline:'', recommendation: raw.slice(0,400), key_risks:[], key_questions:[] };
}

// ── Render ────────────────────────────────────────────
function renderComparison(nameA, nameB, resA, resB, debA, debB, synA, synB, agents) {
  document.getElementById('cmpResults').classList.remove('hidden');

  // Summary table
  const vClassOf = v => ({ STRONG_BUY:'v-sb', BUY:'v-b', WATCH:'v-w', PASS:'v-p', STRONG_PASS:'v-sp' }[v] || 'v-w');
  const scoreColor = s => s >= 7 ? 'var(--green)' : s >= 5 ? 'var(--amber)' : 'var(--red)';
  const winner = (a, b, higherIsBetter=true) => {
    const diff = higherIsBetter ? (a > b ? 'A' : b > a ? 'B' : null) : (a < b ? 'A' : b < a ? 'B' : null);
    return diff === 'A' ? '<span class="winner-badge">winner</span>' : diff === 'B' ? '' : '';
  };

  const rows = [
    { label: 'Verdict',   a: `<span class="verdict-badge ${vClassOf(synA.verdict)}">${(synA.verdict||'').replace('_',' ')}</span>`, b: `<span class="verdict-badge ${vClassOf(synB.verdict)}">${(synB.verdict||'').replace('_',' ')}</span>`, numeric: false },
    { label: 'IC Score',  a: `<span style="color:${scoreColor(synA.score)};font-weight:700;font-family:var(--font-mono)">${synA.score}/10</span>${winner(synA.score, synB.score)}`, b: `<span style="color:${scoreColor(synB.score)};font-weight:700;font-family:var(--font-mono)">${synB.score}/10</span>${winner(synB.score, synA.score)}`, numeric: false },
    { label: 'Conviction', a: synA.conviction||'—', b: synB.conviction||'—', numeric: false },
    { label: 'Sector',    a: esc(resA.sector||'—'), b: esc(resB.sector||'—'), numeric: false },
    { label: 'Thesis',    a: esc(cleanStr(synA.headline)), b: esc(cleanStr(synB.headline)), numeric: false },
    { label: 'Bull Case', a: md2(cleanStr(synA.bull_case)), b: md2(cleanStr(synB.bull_case)), numeric: false },
    { label: 'Bear Case', a: md2(cleanStr(synA.bear_case)), b: md2(cleanStr(synB.bear_case)), numeric: false },
    { label: 'Recommendation', a: md2(cleanStr(synA.recommendation)), b: md2(cleanStr(synB.recommendation)), numeric: false },
  ];

  document.getElementById('summaryTable').innerHTML = `
    <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-3);margin-bottom:12px;">Comparison Summary</div>
    <div style="overflow-x:auto;">
    <table class="cmp-table">
      <thead><tr>
        <th style="width:110px"></th>
        <th style="color:var(--accent)">${esc(resA.companyName || nameA)}</th>
        <th style="color:#06b6d4">${esc(resB.companyName || nameB)}</th>
      </tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td class="row-label">${r.label}</td>
        <td>${r.a}</td>
        <td>${r.b}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;

  // Render each column
  renderCol('colA', nameA, resA, debA, synA, agents, '#6c4ec8', 'A');
  renderCol('colB', nameB, resB, debB, synB, agents, '#06b6d4', 'B');
}

function renderCol(colId, name, res, deb, syn, agents, color, label) {
  const col = document.getElementById(colId);
  const vClass = { STRONG_BUY:'v-sb', BUY:'v-b', WATCH:'v-w', PASS:'v-p', STRONG_PASS:'v-sp' }[syn.verdict] || 'v-w';
  const scoreCol = syn.score >= 7 ? 'var(--green)' : syn.score >= 5 ? 'var(--amber)' : 'var(--red)';
  const risks = Array.isArray(syn.key_risks) ? syn.key_risks : [];
  const questions = Array.isArray(syn.key_questions) ? syn.key_questions : [];

  col.innerHTML = `
    <!-- Header -->
    <div class="cmp-card" style="border-top:3px solid ${color}">
      <div class="verdict-bar">
        <div>
          <div style="font-size:16px;font-weight:800;color:var(--text-1);margin-bottom:6px;">${esc(res.companyName || name)}</div>
          <span class="verdict-badge ${vClass}">${(syn.verdict||'WATCH').replace('_',' ')}</span>
        </div>
        <div style="margin-left:auto;text-align:center;">
          <div class="score-num" style="color:${scoreCol}">${syn.score}</div>
          <div style="font-size:9px;font-family:var(--font-mono);color:var(--text-3);">/10</div>
        </div>
      </div>
      <div style="padding:0 16px 14px;font-size:12px;color:var(--text-2);line-height:1.6;">${esc(cleanStr(syn.headline))}</div>
    </div>

    <!-- Recommendation -->
    <div class="cmp-card">
      <div class="cmp-card-header">IC Recommendation</div>
      <div class="cmp-card-body" style="font-size:12px;">${md2(cleanStr(syn.recommendation))}</div>
    </div>

    <!-- Key Questions -->
    ${questions.length ? `
    <div class="cmp-card" style="border-color:rgba(108,78,200,0.2);">
      <div class="cmp-card-header" style="color:var(--accent);">❓ Key Open Questions</div>
      <div class="cmp-card-body">
        ${questions.map((q,i) => `<div style="display:flex;gap:8px;margin-bottom:8px;font-size:12px;"><span style="color:var(--accent);font-weight:700;flex-shrink:0">Q${i+1}</span><span>${esc(cleanStr(String(q)))}</span></div>`).join('')}
      </div>
    </div>` : ''}

    <!-- Key Risks -->
    ${risks.length ? `
    <div class="cmp-card">
      <div class="cmp-card-header">Key Risks</div>
      <div class="cmp-card-body">
        ${risks.map(r => `<div style="display:flex;gap:8px;margin-bottom:6px;font-size:12px;"><span style="color:var(--red);flex-shrink:0">▲</span><span>${esc(cleanStr(String(r)))}</span></div>`).join('')}
      </div>
    </div>` : ''}

    <!-- Agent Debate -->
    <div class="cmp-card">
      <div class="cmp-card-header">Agent Debate</div>
      <div style="padding:8px 0;">
        ${agents.map(agent => {
          const r = deb[agent.id];
          if (!r) return '';
          return `<div style="padding:10px 16px;border-bottom:1px solid var(--border);">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
              <span>${agent.emoji}</span>
              <span style="font-size:11px;font-weight:600;color:var(--text-1)">${agent.name.en}</span>
              <span style="font-size:10px;color:var(--text-3)">${agent.role.en}</span>
            </div>
            <div style="font-size:12px;color:var(--text-1);line-height:1.65;">${md2(r.text)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

// ── Helpers ───────────────────────────────────────────
function buildResSummary(res) {
  if (!res) return '';
  const lines = [];
  if (res.companyName) lines.push('Company: ' + res.companyName);
  if (res.sector)      lines.push('Sector: '  + res.sector);
  if (res.description) lines.push('Overview: ' + res.description);
  const skip = new Set(['companyName','sector','description','_rawMode']);
  for (const [k,v] of Object.entries(res)) {
    if (skip.has(k) || !v) continue;
    lines.push(k + ': ' + String(v).slice(0,250));
  }
  return lines.join('\n').slice(0,2000);
}

function cleanStr(val) {
  if (!val) return '';
  let s = String(val).trim();
  const fi = s.indexOf('```');
  if (fi > 0) { const pre = s.slice(0,fi).trim(); if (pre.length>10) return pre; }
  s = s.replace(/^```(?:json)?\s*/im,'').replace(/\s*```\s*$/im,'').trim();
  if (s.startsWith('{')) {
    try { const o = JSON.parse(s); const strs = Object.values(o).filter(v=>typeof v==='string'&&v.length>10&&!v.startsWith('{')); if(strs.length) return strs.sort((a,b)=>b.length-a.length)[0]; } catch(e) {}
    return '';
  }
  return s;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function md2(s) {
  if (!s) return '';
  return String(s)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^#{1,3} (.+)/gm,'<strong>$1</strong>')
    .replace(/^[-*] (.+)/gm,'<span style="display:flex;gap:6px"><span style="color:var(--text-3);flex-shrink:0">•</span><span>$1</span></span>')
    .replace(/\n{2,}/g,'<br><br>')
    .replace(/\n/g,'<br>');
}

function setStatus(msg) {
  const el = document.getElementById('cmpStatus');
  if (msg) {
    el.innerHTML = `<span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span> ${esc(msg)}`;
  } else {
    el.innerHTML = '';
  }
}
function showCmpError(msg) {
  const el = document.getElementById('cmpError');
  el.textContent = msg;
  el.classList.remove('hidden');
}

init();
</script>
